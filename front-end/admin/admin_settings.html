<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Settings | Admin Hub</title>
    <link rel="stylesheet" href="admin_styles.css">
    <link rel="stylesheet" href="/assets/vendor/fontawesome-6.4.0/css/all.min.css">
    <style>
        .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
        .settings-card { background: white; border: 1px solid var(--admin-border); border-radius: 12px; padding: 24px; }
        .settings-card h2 { margin-bottom: 18px; font-size: 1.05rem; }
        .settings-field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .settings-field:last-child { margin-bottom: 0; }
        .settings-field label { color: #64748b; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; }
        .settings-field input { border: 1px solid var(--admin-border); border-radius: 8px; padding: 11px 12px; font: inherit; }
        .settings-actions { display: flex; justify-content: flex-end; margin-top: 22px; }
        @media (max-width: 760px) { .settings-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="admin-dashboard-layout">
    <div id="admin-sidebar-placeholder"></div>
    <main class="admin-main-content">
        <div id="admin-navbar-placeholder"></div>
        <div class="admin-view-padding">
            <div class="view-header">
                <h1>Platform Settings</h1>
                <p>Manage the public support details and core arbitration defaults.</p>
            </div>

            <form id="settingsForm">
                <div class="settings-grid">
                    <section class="settings-card">
                        <h2>General</h2>
                        <div class="settings-field">
                            <label for="g-name">Platform name</label>
                            <input id="g-name" required>
                        </div>
                        <div class="settings-field">
                            <label for="g-email">Support email</label>
                            <input id="g-email" type="email" required>
                        </div>
                        <div class="settings-field">
                            <label for="g-phone">Support phone</label>
                            <input id="g-phone" required>
                        </div>
                        <div class="settings-field">
                            <label for="g-timezone">Timezone</label>
                            <input id="g-timezone" required>
                        </div>
                    </section>

                    <section class="settings-card">
                        <h2>Arbitration</h2>
                        <div class="settings-field">
                            <label for="a-resolution">Maximum resolution time (days)</label>
                            <input id="a-resolution" type="number" min="1" required>
                        </div>
                        <div class="settings-field">
                            <label for="a-duration">Default hearing duration (hours)</label>
                            <input id="a-duration" type="number" min="1" required>
                        </div>
                        <div class="settings-field">
                            <label for="a-file-size">Maximum upload size (MiB)</label>
                            <input id="a-file-size" type="number" min="1" required>
                        </div>
                        <div class="settings-field">
                            <label for="a-file-types">Allowed file types</label>
                            <input id="a-file-types" required>
                        </div>
                    </section>
                </div>
                <div class="settings-actions">
                    <button class="btn-primary-sm" type="submit" style="padding: 12px 24px;">
                        <i class="fa-solid fa-floppy-disk"></i> Save Settings
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="admin_backend_data.js"></script>
    <script src="admin_sidebar.js"></script>
    <script src="admin_navbar.js"></script>
    <script>
        function populateSettingsForm() {
            const settings = AdminData.settings || {};
            const general = settings.general || {};
            const arbitration = settings.arbitration || {};
            document.getElementById('g-name').value = general.name || '';
            document.getElementById('g-email').value = general.email || '';
            document.getElementById('g-phone').value = general.phone || '';
            document.getElementById('g-timezone').value = general.timezone || '';
            document.getElementById('a-resolution').value = arbitration.maxResolutionTime || 45;
            document.getElementById('a-duration').value = arbitration.defaultHearingDuration || 2;
            document.getElementById('a-file-size').value = arbitration.maxFileSize || 25;
            document.getElementById('a-file-types').value = arbitration.allowedFileTypes || 'PDF, PNG, JPG, DOCX, XLSX';
        }

        async function saveSettings(event) {
            event.preventDefault();
            const submit = document.querySelector('#settingsForm button[type="submit"]');
            submit.disabled = true;
            try {
                const updated = await requestAdminApi('/settings', {
                    method: 'PATCH',
                    headers: getAdminRequestHeaders(),
                    body: {
                        general: {
                            name: document.getElementById('g-name').value.trim(),
                            email: document.getElementById('g-email').value.trim(),
                            phone: document.getElementById('g-phone').value.trim(),
                            timezone: document.getElementById('g-timezone').value.trim()
                        },
                        arbitration: {
                            maxResolutionTime: Number(document.getElementById('a-resolution').value),
                            defaultHearingDuration: Number(document.getElementById('a-duration').value),
                            maxFileSize: Number(document.getElementById('a-file-size').value),
                            allowedFileTypes: document.getElementById('a-file-types').value.trim()
                        }
                    }
                });
                AdminData.settings = updated;
                saveAdminData();
                window.showAppToast('Settings saved to the backend successfully.', 'success');
            } catch (error) {
                window.showAppToast(error.message || 'Settings could not be saved.', 'error');
            } finally {
                submit.disabled = false;
            }
        }

        document.getElementById('settingsForm').addEventListener('submit', saveSettings);
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.AdminDataReady) await window.AdminDataReady;
            populateSettingsForm();
        });
    </script>
</body>
</html>
